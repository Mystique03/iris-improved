[project]
name = "iris-voice-assistant"
version = "0.1.0"
description = "Voice assistant for disease diagnosis using ML and Gemini LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.26",
    "SpeechRecognition>=3.10",
    "pyttsx3>=2.90",
    "pyaudio>=0.2.14",
    "google-generativeai>=0.8",
    "python-dotenv>=1.0",
    "xgboost>=2.0",
    "groq>=1.2.0",
]
